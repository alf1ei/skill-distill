[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-distill"
version = "0.1.0"
description = "Distill personal chat logs into reusable SKILL.md files, SFT datasets and a skills portfolio"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "alf1ei"}]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["requests>=2"]
train = ["torch", "transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate"]

[project.scripts]
skill-distill = "skill_distill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
